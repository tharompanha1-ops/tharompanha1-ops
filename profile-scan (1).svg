<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="470" viewBox="0 0 1040 470" font-family="'JetBrains Mono','Fira Code','Courier New',monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f14"/>
      <stop offset="100%" stop-color="#060a0d"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4de8d4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4de8d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4de8d4" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="mapClip">
      <rect x="16" y="46" width="436" height="394"/>
    </clipPath>
  </defs>

  <style>
    .win { fill: url(#bg); stroke: #16323a; stroke-width: 1.5; }
    .titlebar { fill: #0d1418; }
    .dot-r { fill: #ff5f56; } .dot-y { fill: #ffbd2e; }
    .dot-g { fill: #27c93f; animation: pulseDot 2s ease-in-out infinite; }
    .title-text { fill: #5ee6d0; font-size: 13px; letter-spacing: 2px; }
    .ascii { fill: #4de8d4; font-size: 8.2px; letter-spacing: 0px; filter: url(#glow); animation: pulseGlow 3.2s ease-in-out infinite; }
    .panel-label { fill: #38bdf8; font-size: 11px; letter-spacing: 3px; opacity: 0.8; }
    .field-key { fill: #5ee6d0; font-size: 13px; opacity: 0.75; }
    .field-val { fill: #e8fdfa; font-size: 13px; opacity: 0; animation: fadeInField 0.5s ease-out forwards; }
    .divider { stroke: #17323a; stroke-width: 1; }
    .footer { fill: #2f5b5e; font-size: 11px; }
    .prompt { fill: #34d399; font-size: 12px; }
    .cursor { fill: #34d399; animation: blink 1s step-end infinite; }
    @keyframes pulseGlow { 0%, 100% { opacity: 0.75; } 50% { opacity: 1; } }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes fadeInField { to { opacity: 1; } }
  </style>

  <rect class="win" x="1" y="1" width="1038" height="468" rx="10"/>

